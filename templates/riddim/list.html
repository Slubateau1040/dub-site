{% extends 'base.html' %}

{% block content %}
    <h1>Riddims :</h1>
    <form method="get">
        <select name="genre">
            <option value="">All genres</option>
            {% for genre in genre_list %}
                <option value="{{ genre }}">{{ genre }}</option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>
    <ul>
    {% for riddim in riddims %}
    	<li>
        <a href="{% url 'detail_riddim' riddim.id %}">{{ riddim.name }}</a>
        </li>
    {% endfor %}
    </ul>

    <a href="{% url 'create_riddim' %}">Create Riddim</a>

{% endblock %}
