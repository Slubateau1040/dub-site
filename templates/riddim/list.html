{% extends 'base.html' %}

{% block content %}
    <h1>Riddims :</h1>
    <form method="get" class="filter-form">
        <select name="genre">
            <option value="">All genres</option>
            {% for genre in genre_list %}
                <option value="{{ genre }}">{{ genre }}</option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>

    {% for riddim in riddims %}
        <a href="{% url 'detail_riddim' riddim.id %}" class="riddim-card">
            <span class="riddim-name">{{ riddim.name }}</span>
            <span class="riddim-genre">{{ riddim.genre }}</span>
        </a>
    {% endfor %}

    <a href="{% url 'create_riddim' %}" class="btn-create">Create Riddim</a>

{% endblock %}
